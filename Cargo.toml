[package]
name = "rustbucket"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "rustbucket"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
rand = { version = "0.8", features = ["small_rng"] }
rayon = "1"
io-uring = "0.7"
anyhow = "1"
libc = "0.2"
crossbeam-channel = "0.5"
memmap2 = "0.9"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
