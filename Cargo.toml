[package]
name = "rustbucket"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "rustbucket"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
rand = { version = "0.8", features = ["small_rng"] }
rayon = "1"
anyhow = "1"
crossbeam-channel = "0.5"
memmap2 = "0.9"

# Linux-specific dependencies
[target.'cfg(target_os = "linux")'.dependencies]
io-uring = "0.7"
libc = "0.2"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
